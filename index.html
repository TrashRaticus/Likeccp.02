}
function updateCoins(){document.getElementById('coinCount').textContent=coins;localStorage.setItem('petalCoins',coins)}
let toastTimer;function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
function progress(){let done=photoDone;document.getElementById('progressBar').style.width=done?'100%':'40%';document.getElementById('missionText').textContent=done?'Challenge complete — you’re a star!':'Style a look and take a photo';document.getElementById('reward').textContent=done?'✓ Done':' +35 🪙'}
function getLooks(){try{return JSON.parse(localStorage.getItem('petalLooks')||'[]')}catch{return[]}}function showLooks(){let bg=document.getElementById('modalBg'),list=document.getElementById('savedList'),looks=getLooks();list.innerHTML=looks.length?looks.map((l,i)=>`<div class="saved-look"><span class="look-emoji">${l.emoji}</span><div><b>${l.name}</b><small>${l.date}</small></div><button data-load="${i}">Wear this</button><button data-delete="${i}">×</button></div>`).join(''):'<div class="empty">Your lookbook is waiting for its first little masterpiece 🌷</div>';bg.classList.add('open');list.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{selected={...looks[b.dataset.load].selected};renderDoll();drawWardrobe();bg.classList.remove('open');toast('Look is back on your muse!')});list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let a=getLooks();a.splice(b.dataset.delete,1);localStorage.setItem('petalLooks',JSON.stringify(a));showLooks()})}
function saveLook(){let looks=getLooks();let n=looks.length+1;looks.unshift({name:['Sunday in Bloom','A Little Daydream','Petal Perfect','Soft Girl Summer'][Math.floor(Math.random()*4)],emoji:['🌷','🎀','🌸','✨'][Math.floor(Math.random()*4)],date:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'}),selected:{...selected}});localStorage.setItem('petalLooks',JSON.stringify(looks.slice(0,20)));toast('Saved to your lookbook ♡')}
document.getElementById('saveBtn').onclick=saveLook;document.getElementById('photoBtn').onclick=()=>{if(!photoDone){photoDone=true;coins+=35;updateCoins();localStorage.setItem('petalPhoto','yes');progress();toast('Photo perfect! Daily challenge complete +35 coins ✨')}else{toast('A lovely photo for your collection! 📸')}};document.getElementById('favoriteBtn').onclick=e=>{likes++;localStorage.setItem('petalLikes',likes);e.currentTarget.textContent='♥';e.currentTarget.style.color='#e56e90';toast('This look is lovely! ♡')};document.getElementById('resetBtn').onclick=()=>{selected={dress:0,top:null,bottom:null,hair:0,accessory:null};active='dress';renderDoll();drawWardrobe();toast('Back to your original look')};document.getElementById('closeModal').onclick=()=>document.getElementById('modalBg').classList.remove('open');document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')e.currentTarget.classList.remove('open')};['railLooks','mobileLooks'].forEach(id=>document.getElementById(id).onclick=showLooks);document.getElementById('railTasks').onclick=()=>{document.getElementById('mission').scrollIntoView({behavior:'smooth',block:'center'});toast(photoDone?'You completed today’s challenge!':'Take a photo to complete today’s challenge!')};document.getElementById('mobileTasks').onclick=()=>document.getElementById('railTasks').onclick();let muted=false;document.getElementById('soundBtn').onclick=e=>{muted=!muted;e.currentTarget.innerHTML=(muted?'♫̸':'♫')+'<span>SOUND</span>';toast(muted?'Sound off':'Sound on')};
drawWardrobe();renderDoll();updateCoins();progress();
</script></body></html>
